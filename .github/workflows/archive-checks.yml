name: Archive checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_archive.py
      - run: python robodojo/scripts/test_eval150_contract.py
